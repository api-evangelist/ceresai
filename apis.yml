aid: ceresai
name: CeresAI
description: >-
  CeresAI (formerly Ceres Imaging) is an aerial and satellite agricultural
  intelligence platform that converts high-resolution spectral imagery and
  machine learning into field-level insights on crop health, water stress,
  yield, and financial risk. The company serves growers, agribusinesses,
  lenders, and crop-insurance providers across more than 40 crop types on four
  continents, drawing on billions of plant-level data points to support
  yield protection, sustainability scorecards, portfolio risk analysis, and
  insurance claims. CeresAI operates a customer application and a login-gated
  developer documentation portal at dev.ceres.ai; pricing is consultation-based
  rather than self-serve. Backed by Insight Partners.
